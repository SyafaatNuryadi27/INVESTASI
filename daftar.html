<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bengkulu Investasi - Registrasi Akun</title>
    
    <style>
        :root {
            --bg-main: #f4f6f8;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --accent-brand: #059669;
            --accent-brand-hover: #047857;
            --accent-brand-bg: #ecfdf5;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            width: 100%;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            min-width: 0;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 800;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border-left: 3px solid var(--accent-brand);
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text span {
            color: var(--accent-brand);
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            width: 100%;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px 16px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 440px;
        }

        @media (min-width: 480px) {
            .auth-card {
                padding: 28px 24px;
                box-shadow: var(--shadow-lg);
            }
        }

        .auth-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 70px;
            line-height: 1.4;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper .form-input {
            padding-right: 42px;
        }

        .toggle-password {
            position: absolute;
            right: 4px;
            background: transparent;
            border: none;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--text-primary);
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            padding: 12px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            letter-spacing: 0.01em;
            margin-top: 8px;
        }

        .btn:active { transform: scale(0.98); }

        .btn-brand {
            background-color: var(--accent-brand);
            color: #ffffff;
        }

        .btn-brand:hover {
            background-color: var(--accent-brand-hover);
        }

        .btn-brand:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-brand);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 20px 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: auto;
            width: 100%;
        }

        footer p + p { margin-top: 4px; font-size: 0.68rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="logo-box">
                <div class="logo-icon">BI</div>
                <div class="logo-text">InvestasiBengkulu<span>.my.id</span></div>
            </a>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1 class="auth-title">Buat Akun Baru</h1>
            <p class="auth-subtitle">Lengkapi formulir di bawah untuk pendaftaran investor.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="fullname">Nama Lengkap</label>
                    <input type="text" id="fullname" class="form-input" placeholder="Nama sesuai KTP" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="phone">Nomor Telepon / WhatsApp</label>
                    <input type="tel" id="phone" class="form-input" placeholder="081234567890" required autocomplete="tel">
                </div>

                <div class="form-group">
                    <label for="address">Alamat Tempat Tinggal</label>
                    <textarea id="address" class="form-input" placeholder="Masukkan alamat domisili lengkap" required autocomplete="street-address"></textarea>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Minimal 8 karakter" minlength="8" required autocomplete="new-password">
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Tampilkan kata sandi">
                            <svg id="eyeIcon" viewBox="0 0 24 24">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand">Daftar Akun</button>
            </form>

            <div class="auth-footer">
                Sudah punya akun? <a href="login.html">Masuk di sini</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 bengkuluinvestasi.my.id &bull; Portal Resmi Informasi Investasi Daerah Bengkulu</p>
        <p>Layanan Informasi Terpadu Proyek Daerah Bagi Masyarakat Provinsi Bengkulu.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDlgpm04sI7Jweytg2IzTHgp8w-VM1SMKw",
            authDomain: "investasi-bengkulu.firebaseapp.com",
            projectId: "investasi-bengkulu",
            storageBucket: "investasi-bengkulu.firebasestorage.app",
            messagingSenderId: "273258663588",
            appId: "1:273258663588:web:a4c96b4d438a4462fca031"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const registerForm = document.getElementById('registerForm');

            const eyeOpenPath = `
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            `;
            
            const eyeClosedPath = `
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            `;

            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                if (isPassword) {
                    passwordInput.setAttribute('type', 'text');
                    eyeIcon.innerHTML = eyeClosedPath;
                    togglePasswordBtn.setAttribute('aria-label', 'Sembunyikan kata sandi');
                } else {
                    passwordInput.setAttribute('type', 'password');
                    eyeIcon.innerHTML = eyeOpenPath;
                    togglePasswordBtn.setAttribute('aria-label', 'Tampilkan kata sandi');
                }
            });

            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const address = document.getElementById('address').value.trim();
                const password = passwordInput.value;
                const submitBtn = registerForm.querySelector('button[type="submit"]');

                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Memproses...';

                    // 1. Buat akun otentikasi di Firebase Auth
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // 2. Simpan profil user
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        fullname: fullname,
                        email: email,
                        phone: phone,
                        address: address,
                        createdAt: new Date().toISOString()
                    });

                    // 3. Inisialisasi portofolio saldo awal khusus akun ini (Rp 0)
                    await setDoc(doc(db, "portfolios", user.uid), {
                        modalUtama: 0,
                        totalProfitTerkumpul: 0,
                        updatedAt: new Date().toISOString()
                    });

                    alert('Registrasi akun berhasil! Silakan masuk.');
                    window.location.href = 'login.html';

                } catch (error) {
                    console.error("Gagal melakukan registrasi:", error);
                    let errorMessage = "Terjadi kesalahan saat mendaftar.";
                    if (error.code === 'auth/email-already-in-use') {
                        errorMessage = "Alamat email sudah terdaftar.";
                    } else if (error.code === 'auth/weak-password') {
                        errorMessage = "Kata sandi terlalu lemah (minimal 6-8 karakter).";
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = "Format alamat email tidak valid.";
                    } else {
                        errorMessage = error.message;
                    }
                    alert(errorMessage);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Daftar Akun';
                }
            });
        });
    </script>
</body>
</html>
