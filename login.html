<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bengkulu Investasi - Masuk Akun</title>
    
    <style>
        /* ==========================================================================
           1. VARIABLES & RESET
           ========================================================================== */
        :root {
            --bg-main: #f4f6f8;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            
            --accent-brand: #059669;
            --accent-brand-hover: #047857;
            --accent-brand-bg: #ecfdf5;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. HEADER & NAVBAR
           ========================================================================== */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            width: 100%;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            min-width: 0;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 800;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border-left: 3px solid var(--accent-brand);
            flex-shrink: 0;
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text span {
            color: var(--accent-brand);
            font-weight: 600;
        }

        /* ==========================================================================
           3. MAIN & AUTH FORM
           ========================================================================== */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            padding: 12px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            letter-spacing: 0.01em;
            margin-top: 8px;
        }

        .btn:active { transform: scale(0.98); }

        .btn-brand {
            background-color: var(--accent-brand);
            color: #ffffff;
        }

        .btn-brand:hover {
            background-color: var(--accent-brand-hover);
        }

        .btn-brand:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-brand);
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* ==========================================================================
           4. FOOTER
           ========================================================================== */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 24px 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: auto;
            width: 100%;
        }

        footer p + p { margin-top: 6px; font-size: 0.68rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo-box">
                <div class="logo-icon">BI</div>
                <div class="logo-text">InvestasiBengkulu<span>.my.id</span></div>
            </a>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1 class="auth-title">Masuk ke Portal</h1>
            <p class="auth-subtitle">Masukkan kredensial Anda untuk mengakses akun.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-brand">Masuk Sekarang</button>
            </form>

            <div class="auth-footer">
                Belum memiliki akun? <a href="daftar.html">Daftar Akun Baru</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 bengkuluinvestasi.my.id &bull; Portal Resmi Informasi Investasi Daerah Bengkulu</p>
        <p>Layanan Informasi Terpadu Proyek Daerah Bagi Masyarakat Provinsi Bengkulu.</p>
    </footer>

    <!-- Script Integrasi Firebase Auth untuk Login -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDlgpm04sI7Jweytg2IzTHgp8w-VM1SMKw",
            authDomain: "investasi-bengkulu.firebaseapp.com",
            projectId: "investasi-bengkulu",
            storageBucket: "investasi-bengkulu.firebasestorage.app",
            messagingSenderId: "273258663588",
            appId: "1:273258663588:web:a4c96b4d438a4462fca031"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const submitBtn = loginForm.querySelector('button[type="submit"]');

                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Memproses...';

                    // Proses login menggunakan Firebase Authentication
                    await signInWithEmailAndPassword(auth, email, password);

                    alert('Login berhasil! Selamat datang kembali.');
                    window.location.href = 'investasi.html';

                } catch (error) {
                    console.error("Gagal masuk:", error);
                    let errorMessage = "Terjadi kesalahan saat masuk.";
                    
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        errorMessage = "Email atau kata sandi salah.";
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = "Format alamat email tidak valid.";
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = "Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.";
                    } else {
                        errorMessage = error.message;
                    }
                    
                    alert(errorMessage);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Masuk Sekarang';
                }
            });
        });
    </script>

</body>
</html>
